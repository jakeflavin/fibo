<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fibo — ephemeral story-point planning for software teams. No accounts, just a link." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Kept in step with the resolved theme by the script below; this value is
         what a scripts-off visitor gets, and matches :root. -->
    <meta name="theme-color" content="#f8f8f8" />

    <!-- iOS reads its own tags rather than the manifest, and ignores an SVG icon. -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Link previews. The image is the app's own cover shot, served from the directory
         that hosts it; crawlers need an absolute URL and will not follow a relative one. -->
    <meta property="og:title" content="fibo — story points, no strings attached" />
    <meta property="og:description" content="Fibo — ephemeral story-point planning for software teams. No accounts, just a link." />
    <meta property="og:site_name" content="Jake's Portfolio" />
    <meta property="og:image" content="https://portfolio-4b9fe.web.app/images/fibo-cover.jpg" />
    <meta property="og:image:alt" content="Fibo" />
    <meta property="og:url" content="https://portfolio-4b9fe.web.app/fibo/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="fibo — story points, no strings attached" />
    <meta name="twitter:description" content="Fibo — ephemeral story-point planning for software teams. No accounts, just a link." />
    <meta name="twitter:image" content="https://portfolio-4b9fe.web.app/images/fibo-cover.jpg" />
    <meta name="twitter:image:alt" content="Fibo" />
    <link rel="canonical" href="https://portfolio-4b9fe.web.app/fibo/" />
    <title>fibo — story points, no strings attached</title>
    <!--
      Resolves the theme before the first paint. The tokens switch on
      <html data-theme>, and React can only set that on mount — a frame too
      late, which shows as a flash of the wrong palette. Mirrors
      `resolveTheme`/`applyTheme` in src/lib/theme.ts: a stored choice wins in
      either direction, otherwise follow the system. There were two of these
      once, and the second read `fibo.theme` for a key written as `fibo:theme`,
      so it always overrode the first with the system answer.
    -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('fibo:theme');
          theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#18191a' : '#f8f8f8');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
