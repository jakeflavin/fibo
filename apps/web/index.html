<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fibo — ephemeral story-point planning for software teams. No accounts, just a link." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cg transform='rotate%28-8 8 8%29'%3E%3Crect x='3.2' y='1.5' width='9.6' height='13' rx='2.2' fill='%231868DB'/%3E%3Crect x='4.6' y='2.9' width='6.8' height='10.2' rx='1.2' fill='none' stroke='rgba%28255,255,255,0.55%29' stroke-width='0.8'/%3E%3Ctext x='8' y='10.9' font-size='7.5' font-weight='700' text-anchor='middle' fill='%23ffffff' font-family='system-ui,-apple-system,sans-serif'%3E%3F%3C/text%3E%3C/g%3E%3C/svg%3E" />
    <title>fibo — story points, no strings attached</title>
    <script>
      // Apply the stored theme before first paint. fibo is dark-first:
      // dark unless the user explicitly chose light.
      (function () {
        var t = 'dark';
        try {
          if (localStorage.getItem('fibo:theme') === 'light') t = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
