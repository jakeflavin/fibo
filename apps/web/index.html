<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fibo — ephemeral story-point planning for software teams. No accounts, just a link." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#18191a" />

    <!-- iOS reads its own tags rather than the manifest, and ignores an SVG icon. -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Link previews. The image is the app's own cover shot, served from the directory
         that hosts it; crawlers need an absolute URL and will not follow a relative one. -->
    <meta property="og:title" content="fibo — story points, no strings attached" />
    <meta property="og:description" content="Fibo — ephemeral story-point planning for software teams. No accounts, just a link." />
    <meta property="og:site_name" content="Jake's Portfolio" />
    <meta property="og:image" content="https://portfolio-4b9fe.web.app/images/fibo-cover.jpg" />
    <meta property="og:image:alt" content="Fibo" />
    <meta property="og:url" content="https://portfolio-4b9fe.web.app/fibo/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="fibo — story points, no strings attached" />
    <meta name="twitter:description" content="Fibo — ephemeral story-point planning for software teams. No accounts, just a link." />
    <meta name="twitter:image" content="https://portfolio-4b9fe.web.app/images/fibo-cover.jpg" />
    <meta name="twitter:image:alt" content="Fibo" />
    <link rel="canonical" href="https://portfolio-4b9fe.web.app/fibo/" />
    <title>fibo — story points, no strings attached</title>
    <script>
      // Apply the stored theme before first paint. fibo is dark-first:
      // dark unless the user explicitly chose light.
      (function () {
        var t = 'dark';
        try {
          if (localStorage.getItem('fibo:theme') === 'light') t = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
      <!--
      Resolves the theme before the first paint. Every app switches tokens on
      <html data-theme>, but React only sets it on mount — so without this the page
      paints the light palette first, which is a white flash on a dark screen.
    -->
    <script>
      try {
        var stored = localStorage.getItem('fibo.theme');
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme =
          stored === 'light' || stored === 'dark' ? stored : dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
