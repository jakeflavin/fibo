name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test:unit

      - name: Typecheck the cleanup function
        run: npm --prefix functions ci && npm --prefix functions run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Realtime Database emulator
        run: |
          npx firebase-tools emulators:start --project demo-fibo --only database &
          timeout 60 bash -c 'until curl -s http://127.0.0.1:9000/ > /dev/null; do sleep 1; done'

      - name: Functions unit + integration tests (against the emulator)
        run: npm --prefix functions test

      - run: npm run test:e2e

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            e2e/screenshots/
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy hosting + database rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-sa.json"
          # --force: auto-accept the artifact-registry cleanup policy prompt
          npx firebase-tools deploy --only hosting,database,functions --project fibo-49d58 --non-interactive --force
